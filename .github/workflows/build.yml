package com.skyiptv.app

import android.content.pm.ActivityInfo
import android.os.Bundle
import android.os.Handler
import android.os.Looper
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.background
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.shape.RoundedCornerShape
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.Brush
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import androidx.compose.ui.platform.LocalContext

private val Navy = Color(0xFF020B16)
private val Blue = Color(0xFF159EFF)

class MainActivity : ComponentActivity() {

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        // إجبار التطبيق على الوضع الأفقي
        requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE

        setContent {
            SpeedTvApp()
        }
    }
}

@Composable
private fun SpeedTvApp() {

    var showSplash by remember {
        mutableStateOf(true)
    }

    LaunchedEffect(Unit) {
        kotlinx.coroutines.delay(3500)
        showSplash = false
    }

    MaterialTheme(
        colorScheme = darkColorScheme(
            primary = Blue,
            background = Navy,
            surface = Color(0xFF0A1D2E)
        )
    ) {

        if (showSplash) {
            SplashScreen()
        } else {
            MainScreen()
        }
    }
}

@Composable
private fun SplashScreen() {

    Box(
        modifier = Modifier
            .fillMaxSize()
            .background(
                Brush.horizontalGradient(
                    listOf(
                        Color(0xFF020B16),
                        Color(0xFF031A31),
                        Color(0xFF020B16)
                    )
                )
            )
    ) {

        // تأثير ضوء أزرق خلف اللاعب
        Box(
            modifier = Modifier
                .fillMaxHeight()
                .width(420.dp)
                .align(Alignment.CenterStart)
                .background(
                    Brush.radialGradient(
                        listOf(
                            Color(0xFF087DCC),
                            Color.Transparent
                        )
                    )
                )
        )

        Row(
            modifier = Modifier
                .fillMaxSize()
                .padding(horizontal = 55.dp),

            verticalAlignment = Alignment.CenterVertically
        ) {

            // اللاعب والكرة
            Box(
                modifier = Modifier
                    .weight(1.2f)
                    .fillMaxHeight(),

                contentAlignment = Alignment.Center
            ) {

                Column(
                    horizontalAlignment =
                        Alignment.CenterHorizontally
                ) {

                    Text(
                        "⚽",
                        fontSize = 145.sp
                    )

                    Spacer(
                        modifier =
                            Modifier.height(10.dp)
                    )

                    Text(
                        "⚡",
                        color = Blue,
                        fontSize = 45.sp
                    )
                }
            }

            // شعار التطبيق
            Column(
                modifier = Modifier
                    .weight(1f)
                    .fillMaxHeight(),

                horizontalAlignment =
                    Alignment.CenterHorizontally,

                verticalArrangement =
                    Arrangement.Center
            ) {

                Row(
                    verticalAlignment =
                        Alignment.CenterVertically
                ) {

                    Text(
                        "TV",
                        color = Blue,
                        fontSize = 55.sp,
                        fontWeight =
                            FontWeight.Bold
                    )

                    Spacer(
                        modifier =
                            Modifier.width(10.dp)
                    )

                    Text(
                        "Speed",
                        color = Color.White,
                        fontSize = 55.sp,
                        fontWeight =
                            FontWeight.Bold
                    )
                }

                Spacer(
                    modifier =
                        Modifier.height(12.dp)
                )

                Text(
                    "متعة المشاهدة بلا حدود",
                    color = Color.White,
                    fontSize = 23.sp
                )

                Spacer(
                    modifier =
                        Modifier.height(28.dp)
                )

                CircularProgressIndicator(
                    color = Blue,
                    strokeWidth = 4.dp,
                    modifier =
                        Modifier.size(42.dp)
                )

                Spacer(
                    modifier =
                        Modifier.height(12.dp)
                )

                Text(
                    "جاري التحميل...",
                    color = Color(0xFF9DB0C2),
                    fontSize = 15.sp
                )
            }
        }
    }
}

@Composable
private fun MainScreen() {

    Box(
        modifier = Modifier
            .fillMaxSize()
            .background(Navy),

        contentAlignment = Alignment.Center
    ) {

        Column(
            horizontalAlignment =
                Alignment.CenterHorizontally
        ) {

            Text(
                "TV Speed",
                color = Color.White,
                fontSize = 42.sp,
                fontWeight =
                    FontWeight.Bold
            )

            Spacer(
                modifier =
                    Modifier.height(15.dp)
            )

            Text(
                "واجهة القنوات ستظهر هنا",
                color = Blue,
                fontSize = 22.sp
            )
        }
    }
}
