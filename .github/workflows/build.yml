@Composable
private fun MainTvScreen() {

    val context = LocalContext.current

    val allChannels = remember {
        loadChannels(context)
    }

    var selected by remember {
        mutableStateOf<Channel?>(null)
    }

    var tab by remember {
        mutableStateOf(0)
    }

    var category by remember {
        mutableStateOf("الكل")
    }

    var search by remember {
        mutableStateOf("")
    }

    val favorites =
        remember {
            mutableStateListOf<String>()
        }

    val visible =
        allChannels.filter { channel ->

            categoryMatches(
                channel,
                category
            ) &&

            (
                search.isBlank() ||
                    channel.name.contains(
                        search,
                        ignoreCase = true
                    )
            ) &&

            (
                tab != 2 ||
                    favorites.contains(channel.name)
            )
        }

    Surface(
        modifier = Modifier.fillMaxSize(),
        color = Navy
    ) {

        if (selected != null) {

            PlayerScreen(
                channel = selected!!,
                back = {
                    selected = null
                }
            )

        } else {

            Column(
                modifier = Modifier.fillMaxSize()
            ) {

                Header()

                Row(
                    modifier = Modifier
                        .weight(1f)
                        .fillMaxWidth()
                        .padding(12.dp),

                    horizontalArrangement =
                        Arrangement.spacedBy(12.dp)
                ) {

                    Column(
                        modifier = Modifier.weight(1.45f)
                    ) {

                        HeroCard(category)

                        Spacer(
                            modifier = Modifier.height(10.dp)
                        )

                        CategoryBar(
                            selected = category,
                            onCategory = {
                                category = it
                                tab = 0
                            }
                        )
                    }

                    Column(
                        modifier = Modifier
                            .weight(1f)
                            .fillMaxHeight()
                            .background(
                                Card,
                                RoundedCornerShape(18.dp)
                            )
                            .padding(10.dp)
                    ) {

                        Row(
                            verticalAlignment =
                                Alignment.CenterVertically
                        ) {

                            Text(
                                if (tab == 2)
                                    "المفضلة"
                                else
                                    "القنوات",

                                color = Color.White,
                                fontSize = 19.sp,
                                fontWeight =
                                    FontWeight.Bold,

                                modifier =
                                    Modifier.weight(1f)
                            )

                            Text(
                                "${visible.size} قناة",
                                color = Muted,
                                fontSize = 12.sp
                            )
                        }

                        Spacer(
                            modifier = Modifier.height(7.dp)
                        )

                        OutlinedTextField(
                            value = search,

                            onValueChange = {
                                search = it
                            },

                            modifier =
                                Modifier.fillMaxWidth(),

                            singleLine = true,

                            placeholder = {
                                Text(
                                    "ابحث عن قناة",
                                    color = Muted
                                )
                            },

                            colors =
                                OutlinedTextFieldDefaults.colors(
                                    focusedBorderColor =
                                        Blue,

                                    unfocusedBorderColor =
                                        Color(0xFF1D3348),

                                    focusedTextColor =
                                        Color.White,

                                    unfocusedTextColor =
                                        Color.White,

                                    cursorColor =
                                        Blue
                                )
                        )

                        Spacer(
                            modifier = Modifier.height(7.dp)
                        )

                        LazyColumn(
                            verticalArrangement =
                                Arrangement.spacedBy(6.dp),

                            contentPadding =
                                PaddingValues(
                                    bottom = 8.dp
                                ),

                            modifier =
                                Modifier.fillMaxSize()
                        ) {

                            items(visible) { channel ->

                                ChannelRow(
                                    channel = channel,

                                    favorite =
                                        favorites.contains(
                                            channel.name
                                        ),

                                    onFavorite = {

                                        if (
                                            favorites.contains(
                                                channel.name
                                            )
                                        ) {
                                            favorites.remove(
                                                channel.name
                                            )
                                        } else {
                                            favorites.add(
                                                channel.name
                                            )
                                        }
                                    },

                                    onPlay = {
                                        selected = it
                                    }
                                )
                            }

                            if (visible.isEmpty()) {

                                item {
                                    EmptyState()
                                }
                            }
                        }
                    }
                }

                BottomNav(
                    tab = tab,
                    onTab = {
                        tab = it
                    }
                )
            }
        }
    }
}

