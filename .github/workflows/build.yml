      - name: Build APK
        working-directory: Speed-TV-Android
        run: |
          cat > fix.gradle <<'EOF'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '1.8'
              targetCompatibility = '1.8'
            }

            tasks.configureEach {
              if (name.toLowerCase().contains('compile') && name.toLowerCase().contains('kotlin')) {
                try {
                  kotlinOptions.jvmTarget = '1.8'
                } catch (Exception ignored) {
                }
              }
            }
          }
          EOF
          gradle -I fix.gradle assembleDebug
