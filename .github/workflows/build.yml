@Composable
private fun HeroCard(
    category: String
) {

    val title =
        when (category) {

            "رياضة" ->
                "رياضة"

            "عراقية" ->
                "القنوات العراقية"

            "MBC" ->
                "MBC"

            "أفلام" ->
                "أفلام"

            "ترفيه" ->
                "ترفيه"

            "إخبارية" ->
                "أخبار"

            else ->
                "Speed TV"
        }

    val subtitle =
        when (category) {

            "رياضة" ->
                "القنوات الرياضية"

            "عراقية" ->
                "أفضل القنوات العراقية"

            "أفلام" ->
                "أحدث الأفلام والقنوات السينمائية"

            "إخبارية" ->
                "آخر الأخبار مباشرة"

            else ->
                "قنواتك المفضلة في مكان واحد"
        }

    Box(
        modifier = Modifier
            .fillMaxWidth()
            .fillMaxHeight()
            .background(
                Brush.linearGradient(
                    when (category) {

                        "رياضة" ->
                            listOf(
                                Color(0xFF075E96),
                                Color(0xFF06121E)
                            )

                        "أفلام" ->
                            listOf(
                                Color(0xFF531B43),
                                Color(0xFF0B1020)
                            )

                        "إخبارية" ->
                            listOf(
                                Color(0xFF185C72),
                                Color(0xFF07121E)
                            )

                        "عراقية" ->
                            listOf(
                                Color(0xFF1A5362),
                                Color(0xFF07121E)
                            )

                        else ->
                            listOf(
                                Color(0xFF07528B),
                                Color(0xFF071322)
                            )
                    }
                ),
                RoundedCornerShape(22.dp)
            )
            .padding(26.dp)
    ) {

        Column(
            modifier = Modifier.fillMaxHeight(),

            verticalArrangement =
                Arrangement.Center
        ) {

            Text(
                if (category == "رياضة")
                    "⚽ رياضة مباشرة"
                else
                    "● مباشر الآن",

                color = Color(0xFFFF4050),
                fontSize = 14.sp,
                fontWeight = FontWeight.Bold
            )

            Spacer(
                modifier = Modifier.height(8.dp)
            )

            Text(
                title,
                color = Color.White,
                fontSize = 38.sp,
                fontWeight = FontWeight.ExtraBold
            )

            Text(
                subtitle,
                color = Color.White.copy(
                    alpha = 0.9f
                ),
                fontSize = 16.sp
            )

            Spacer(
                modifier = Modifier.height(16.dp)
            )

            Surface(
                color = Blue,
                shape = RoundedCornerShape(13.dp)
            ) {

                Text(
                    "شاهد الآن  ▶",
                    color = Color.White,

                    modifier =
                        Modifier.padding(
                            horizontal = 22.dp,
                            vertical = 10.dp
                        ),

                    fontWeight =
                        FontWeight.Bold
                )
            }
        }
    }
}

@Composable
private fun CategoryBar(
    selected: String,
    onCategory: (String) -> Unit
) {

    LazyRow(
        horizontalArrangement =
            Arrangement.spacedBy(7.dp),

        modifier =
            Modifier.fillMaxWidth()
    ) {

        rowItems(categories) { category ->

            Surface(
                color =
                    if (category == selected)
                        Blue
                    else
                        Card2,

                shape =
                    RoundedCornerShape(12.dp),

                modifier =
                    Modifier.clickable {
                        onCategory(category)
                    }
            ) {

                Row(
                    modifier =
                        Modifier.padding(
                            horizontal = 13.dp,
                            vertical = 8.dp
                        ),

                    verticalAlignment =
                        Alignment.CenterVertically
                ) {

                    Text(
                        categoryIcon(category),
                        fontSize = 16.sp
                    )

                    Spacer(
                        modifier =
                            Modifier.width(5.dp)
                    )

                    Text(
                        category,
                        color = Color.White,
                        fontSize = 12.sp
                    )
                }
            }
        }
    }
}

