@Composable
private fun SpeedTvApp() {

    var showIntro by remember {
        mutableStateOf(true)
    }

    LaunchedEffect(Unit) {
        delay(3000)
        showIntro = false
    }

    MaterialTheme(
        colorScheme = darkColorScheme(
            primary = Blue,
            background = Navy,
            surface = Card
        )
    ) {

        CompositionLocalProvider(
            androidx.compose.ui.platform.LocalLayoutDirection
                provides LayoutDirection.Rtl
        ) {

            if (showIntro) {
                IntroScreen()
            } else {
                MainTvScreen()
            }
        }
    }
}

