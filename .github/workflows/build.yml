name: Build Speed TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q Speed-TV-Android.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fix JVM compatibility
        working-directory: Speed-TV-Android
        run: |
          cat > fix.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = '17'
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: Speed-TV-Android
        run: gradle -I fix.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Speed-TV-APK
          path: Speed-TV-Android/app/build/outputs/apk/debug/app-debug.apk
